[project]
name = "fast-zero"
version = "0.1.0"
description = ""
authors = [{ name = "Vinicius Lopes Dias", email = "vinilopes91@gmail.com" }]
requires-python = "==3.12.*"
readme = "README.md"
dependencies = [
    "fastapi[standard]>=0.112.0,<0.113",
    "sqlalchemy>=2.0.32,<3",
    "pydantic-settings>=2.4.0,<3",
    "alembic>=1.13.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2,<9",
    "pytest-cov>=5.0.0,<6",
    "taskipy>=1.13.0,<2",
    "ruff>=0.5.7,<0.6",
    "httpx>=0.27.0,<0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'double'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = 'ruff check . && ruff check . --diff'
format = 'ruff check . --fix && ruff format .'
run = 'fastapi dev fast_zero/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=fast_zero -vv'
post_test = 'coverage html'
